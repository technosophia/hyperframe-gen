<script>
const tl = gsap.timeline({ paused: true });
tl.fromTo("#fond-img", { scale: 1 }, { scale: 1.05, duration: 12.00, ease: "none" }, 0);
function _fmt(n){ return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " "); }
document.querySelectorAll(".step,.step-punch").forEach(function (step) {
  const t = parseFloat(step.getAttribute("data-start"));
  const dur = parseFloat(step.getAttribute("data-duration"));
  const sel = "#" + step.id;
  tl.addLabel(step.getAttribute("data-step"), t);
  const inEl = step.querySelector(".in");
  if (inEl) tl.fromTo("#" + inEl.id, { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, t);
  var _num = step.querySelector(".dbig") || step.querySelector(".dkw");
  if (_num && inEl) tl.fromTo("#" + inEl.id, { scale: 0.85 }, { scale: 1, duration: 0.5, ease: "back.out(1.6)" }, t + 0.1);
  // versus : la colonne gauche diminue, la droite s'agrandit
  var _vs = step.querySelector(".versus");
  if (_vs) {
    tl.fromTo(_vs.querySelector(".vcol.left"), { scale: 1 }, { scale: 0.82, duration: 0.7, ease: "power2.out" }, t + 0.25);
    tl.fromTo(_vs.querySelector(".vcol.right"), { scale: 1 }, { scale: 1.18, duration: 0.7, ease: "power2.out" }, t + 0.25);
  }
  // strike : les deux traits se dessinent
  if (step.querySelector(".sline1")) {
    tl.fromTo(sel + " .sline1", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.inOut", transformOrigin: "center center" }, t + 0.25);
    tl.fromTo(sel + " .sline2", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.inOut", transformOrigin: "center center" }, t + 0.55);
  }
  // diverge : pulse des flèches, gauche puis droite
  if (step.querySelector(".diverge")) {
    tl.fromTo(sel + " .branch.up .darr-big", { scale: 1 }, { scale: 1.5, duration: 0.3, yoyo: true, repeat: 1, ease: "power2.inOut" }, t + 0.4);
    tl.fromTo(sel + " .branch.down .darr-big", { scale: 1 }, { scale: 1.5, duration: 0.3, yoyo: true, repeat: 1, ease: "power2.inOut" }, t + 0.9);
  }
  // count : compteur
  step.querySelectorAll(".ctr").forEach(function (el) {
    var obj = { val: 0 }, target = parseFloat(el.getAttribute("data-target"));
    tl.to(obj, { val: target, duration: 0.9, ease: "power2.out", onUpdate: function () { el.textContent = _fmt(obj.val); } }, t + 0.15);
  });
  // enumerate : seul le nouvel item apparaît
  if (step.querySelector(".it.new")) tl.fromTo(sel + " .it.new", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
  // stamp : claque ; chip, icon : pop ; flèche : glisse
  if (step.querySelector(".stamp")) tl.fromTo(sel + " .stamp", { scale: 2.4, opacity: 0, rotation: -12 }, { scale: 1, opacity: 1, rotation: -4, duration: 0.25, ease: "power4.in", stagger: 0.2 }, t + 0.35);
  if (step.querySelector(".chip")) tl.fromTo(sel + " .chip", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(2)", stagger: 0.15 }, t + 0.2);
  if (step.querySelector(".dico")) tl.fromTo(sel + " .dico", { scale: 0 }, { scale: 1, duration: 0.35, ease: "back.out(2)", stagger: 0.12 }, t + 0.2);
  if (step.querySelector(".darr")) tl.fromTo(sel + " .darr", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.35, ease: "power2.out", stagger: 0.25 }, t + 0.3);
  // punch : mot à mot
  if (step.classList.contains("step-punch")) tl.fromTo(sel + " .w", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out", stagger: 0.22 }, t + 0.1);
  // ref-card : entrée (opacity, y), extrait en or, zoom lent (scale seul, sans retomber sur l'entrée)
  var _ref = step.querySelector(".ref-card");
  if (_ref) {
    tl.fromTo("#" + _ref.id, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, t);
    tl.to("#" + _ref.id + " .hl", { color: "#F0B429", backgroundColor: "rgba(240,180,41,0.16)", duration: 0.4 }, t + 0.3);
    tl.fromTo("#" + _ref.id, { scale: 1 }, { scale: 1.03, duration: dur, ease: "none", immediateRender: false }, t);
  }
  // images plein écran : zoom lent
  var _img = step.querySelector("img.fond, img.ref-shot");
  if (_img) tl.fromTo("#" + _img.id, { scale: 1 }, { scale: _img.classList.contains("fond") ? 1.06 : 1.04, duration: dur, ease: "none" }, t);
});
window.__timelines = window.__timelines || {};
window.__timelines["i01"] = tl;
</script>
