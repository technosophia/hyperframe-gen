<script>
function applyCam(tl, frame, mode, t) {
  var box = mode === "full"
    ? { top: "25%", left: "25%", right: "auto", bottom: "auto", width: "50%", height: "50%", borderColor: "transparent", boxShadow: "0 0 40px rgba(0,0,0,.6)" }

  tl.set(frame, Object.assign({ visibility: mode === "off" ? "hidden" : "visible" }, box), t);
  var blur = mode === "full" ? "blur(8px)" : "blur(0px)";
  tl.to("#fond", { filter: blur, duration: 0.3 }, t);
  document.querySelectorAll(".step,.step-punch").forEach(function (st) {
    tl.to("#" + st.id, { filter: blur, duration: 0.3 }, t);
  });
}

tl.fromTo("#fond-img", { scale: 1 }, { scale: 1.05, duration: 8, ease: "none" }, 0);
document.querySelectorAll(".step,.step-punch").forEach(function (step) {

  const camMode = step.getAttribute("data-cam") || "off";
  applyCam(tl, "#cam-frame-i00", camMode, t);
  tl.addLabel(step.getAttribute("data-step"), t);
  const inEl = step.querySelector(".in");
  if (inEl) tl.fromTo("#" + inEl.id, { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, t);
  // Dynamique : versus (gauche diminue, droite s'agrandit) + pulse des chiffres

  if (_vs) {

    var _r = _vs.querySelector(".vcol.right");
    if (_l) tl.fromTo(_l, { scale: 1 }, { scale: 0.82, duration: 0.7, ease: "power2.out" }, t + 0.25);
    if (_r) tl.fromTo(_r, { scale: 1 }, { scale: 1.18, duration: 0.7, ease: "power2.out" }, t + 0.25);

});
